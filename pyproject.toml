[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "c2p"
version = "0.0.1"
description = "Compression-based prediction over typed causal hypergraphs and finite Markov kernels."
requires-python = ">=3.10"
license = {file = "LICENSE"}
# The numerical core is standard-library only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Only tests/ is collected: Chandra/ and ref-code/ carry their own suites.
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
